name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: edgelab
          POSTGRES_PASSWORD: edgelab
          POSTGRES_DB: edgelab
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U edgelab -d edgelab"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: corepack enable
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm secret:scan
      - run: pnpm check
      - run: pnpm build
