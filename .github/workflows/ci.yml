name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      TEST_DATABASE_ADMIN_URL: postgres://edgelab:edgelab@localhost:5432/postgres
      TEST_DATABASE_URL: postgres://edgelab:edgelab@localhost:5432/edgelab_test
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: edgelab
          POSTGRES_PASSWORD: edgelab
          POSTGRES_DB: edgelab
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U edgelab -d edgelab"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm secret:scan
      - run: pnpm check
      - run: pnpm build
      - run: pnpm evidence:manifest:check
